# ~/.config/kitty/kitty.conf

###########################
# Terminal Environment
###########################
env TERM xterm-256color

###########################
# Window
###########################
padding_width 0
window_padding_width 0
background_opacity 1.0

# Uncomment to remove window buttons (macOS only)
# macos_hide_titlebar yes
# macos_window_decorations no

###########################
# Font
###########################
font_family JetBrainsMonoNL Nerd Font
bold_font auto
italic_font auto
font_size 14.0
enable_ligatures yes

###########################
# macOS Key Modifiers
###########################
# Use both left and right Option keys as Alt
macos_option_as_alt yes
window_title_format kitty

###########################
# Behavior Enhancements
###########################
confirm_os_window_close 0
bell_on_tab true
enable_audio_bell no

###########################
# Clipboard and Mouse
###########################
copy_on_select yes
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

###########################
# Theme Import (dynamic)
###########################
# Default theme to load (you can switch flavors easily)
# include themes/themes/macchiato.conf
include themes/themes/latte.conf
