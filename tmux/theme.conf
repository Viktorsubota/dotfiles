# Theme styles (sourced after color definitions)

# Status bar
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g status-left ""

# Agent state colors (tmux/agents/SPEC.md) — defined early, used below.
# Calm always-on trio: lavender head, sapphire running; unseen sits teal
# and turns yellow the moment its count is nonzero.
# Await and stuck are the alarms: red is red — noticed at a glance — and
# they appear only when nonzero. (Tabs keep their yellow signal block for
# bell/await; red here is the fleet-level alarm.) C-s a glyphs inherit.
set -gF @agent_color_action  "#{@thm_red}"
set -gF @agent_color_unseen  "#{@thm_yellow}"
set -gF @agent_color_running "#{@thm_sapphire}"
set -gF @agent_color_stalled "#{@thm_fg}"
set -gF @agent_color_quiet   "#{@thm_subtext_0}"

# Panes — borders match bg (invisible), inactive panes dimmed
set -gF pane-border-style "fg=#{@thm_surface_0},bg=#{@thm_dim_bg}"
set -gF pane-active-border-style "fg=#{@thm_surface_0},bg=#{@thm_dim_bg}"
set -gF window-style "bg=#{@thm_dim_bg}"
set -gF window-active-style "bg=#{@thm_bg}"

# Messages
set -gF message-style "fg=#{@thm_teal},bg=#{@thm_overlay_0},align=centre"
set -gF message-command-style "fg=#{@thm_teal},bg=#{@thm_overlay_0},align=centre"

# Copy mode and clock
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF clock-mode-colour "#{@thm_blue}"

# Windows — the main-era look: sapphire number square marks the current
# window, grey squares otherwise. The ONLY per-tab agent signal is the
# leading space (same block main showed for bells), driven by the engine
# (@agent_win_sig, computed in agentsd.sh derive): red = await / any
# urgent event, yellow = muted await or a native bell, else invisible.
%hidden SIGBLOCK="##{?##{==:##{@agent_win_sig},red},#{@thm_red},##{?##{||:##{==:##{@agent_win_sig},yellow},##{window_bell_flag}},#{@thm_yellow},#{@thm_mantle}}}"

# tmux's compiled-in bell/activity styles reverse-video the whole tab
# natively, independent of SIGBLOCK — neutralized so the leading space
# stays the only signal, exactly as bell already folds into it above
set -gF window-status-bell-style "none"
set -gF window-status-activity-style "none"
set -g window-status-separator " "
set -gF window-status-format "#[bg=${SIGBLOCK}] #[fg=#{@thm_crust},bg=#{@thm_overlay_2}] ##I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##W "
set -gF window-status-current-format "#[bg=${SIGBLOCK}] #[fg=#{@thm_crust},bg=#{@thm_sapphire}] ##I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] ##W "

# Status right modules
# Agents widget — same ribbon grammar as the directory/session modules:
# left cap on the running grey, icon on the accent, bold count in the
# grey cell (spaces around). Head/running/unseen always there, zeros
# pinned. Await(terminal >_) and stuck(zzz) are red alarms, appearing only
# when nonzero, drawn as one solid red block (icon and count together).
# No agents at all -> widget gone.
set -gF @status_agents "##{?##{E:@agents_any},#[range=user|agents]#[fg=#{@thm_lavender}]  #[fg=#{@thm_crust}##,bg=#{@thm_lavender}]#{@agent_glyph} #[fg=#{@thm_fg}##,bg=#{@thm_surface_0}##,bold] ##{E:@agents_any}#[fg=#{@thm_surface_0}##,nobold] #[fg=#{@agent_color_running}]#[fg=#{@thm_crust}##,bg=#{@agent_color_running}]󰐊 #[fg=#{@thm_fg}##,bg=#{@thm_surface_0}##,bold] ##{E:@agents_n_running_cur}:##{E:@agents_n_running_oth}#[fg=#{@thm_surface_0}##,nobold] #[fg=##{?##{E:@agents_n_unseen},#{@thm_yellow},#{@thm_teal}}]#[fg=#{@thm_crust}##,bg=##{?##{E:@agents_n_unseen},#{@thm_yellow},#{@thm_teal}}]󰈙 #[fg=#{@thm_fg}##,bg=#{@thm_surface_0}##,bold] ##{E:@agents_n_unseen_cur}:##{E:@agents_n_unseen_oth}#[fg=#{@thm_surface_0}##,nobold]##{?##{E:@agents_n_action},  #[fg=#{@agent_color_action}]#[fg=#{@thm_crust}##,bg=#{@agent_color_action}] | #[bold]##{E:@agents_n_action_cur}:##{E:@agents_n_action_oth}#[nobold] #[fg=#{@agent_color_action}##,bg=#{@thm_surface_0}]#[fg=#{@thm_surface_0}],}##{?##{E:@agents_n_stuck},  #[fg=#{@agent_color_stalled}]#[fg=#{@thm_crust}##,bg=#{@agent_color_stalled}]󰒲 | #[bold]##{E:@agents_n_stuck}#[nobold] #[fg=#{@agent_color_stalled}##,bg=#{@thm_surface_0}]#[fg=#{@thm_surface_0}],}#[norange],}"

set -gF @status_directory "#[fg=#{@thm_rosewater}]#[fg=#{@thm_crust},bg=#{@thm_rosewater}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ./##{b:pane_current_path}#[fg=#{@thm_surface_0}]"
set -gF @status_session "#[fg=##{?client_prefix,#{@thm_red},#{@thm_teal}}]#[fg=#{@thm_crust},bg=##{?client_prefix,#{@thm_red},#{@thm_teal}}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##S#[fg=#{@thm_surface_0}] "
set -gF @status_pad "#[fg=#{@thm_surface_0},bg=#{@thm_surface_0}] "
set -gF @status_zoom "  #[fg=#{@thm_flamingo}]#[fg=#{@thm_crust},bg=#{@thm_flamingo}]  #[fg=#{@thm_flamingo},bg=#{@thm_surface_0}]#[fg=#{@thm_surface_0}]"
