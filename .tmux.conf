# Status
set -g status-interval 1
set -g escape-time 10

# Terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
bind C-a send-prefix

unbind %
bind v split-window -h -c "#{pane_current_path}"

unbind '"'
bind g split-window -v -c "#{pane_current_path}"

# Bind better session search
unbind s
set -g @tzs-key-launch 's'

set-option -g status-position top

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

bind-key o kill-pane -a

set -g allow-passthrough on

set-option -g history-limit 100000
set-option -g set-titles on
set-option -g set-titles-string "#T"

set -g mouse on
set-option -s focus-events on

# Use vi keys in copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Catppuccin
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor "latte"

# Panes
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_status "yes"
set -g @catppuccin_window_current_fill "text"

# Status
set -g status-left ""
set -g status-right-length 200
set -g @catppuccin_status_background 'default'

# Windows
set -g window-status-separator "  "
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_middle_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_number " #I "
set -g @catppuccin_window_current_left_separator ""
set -g @catppuccin_window_current_middle_separator ""
set -g @catppuccin_window_current_right_separator ""
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_current_number " #I "
set -g @catppuccin_window_current_text_color "#{@thm_sapphire}"
set -g @catppuccin_window_current_number_color "#{@thm_sapphire}"


# Custom zoom module
%hidden MODULE_NAME="zoom"
set -g "@catppuccin_${MODULE_NAME}_icon" " "
set -gF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_yellow}"
set -gF "@catppuccin_status_${MODULE_NAME}_icon_bg" "#{E:@thm_yellow}"
set -gF "@catppuccin_status_${MODULE_NAME}_icon_fg" "#{E:@thm_crust}"
set -gF "@catppuccin_status_${MODULE_NAME}_text_fg" "#{E:@thm_yellow}"
set -gF "@catppuccin_status_${MODULE_NAME}_text_bg" "#{E:@thm_crust}"
set -g "@catppuccin_${MODULE_NAME}_text" ""
source ~/dotfiles/tmux/zoom_module.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'jeffnguyen695/tmux-zoxide-session'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Install TMUX plugin manager if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run '
        git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && \
        ~/.tmux/plugins/tpm/bindings/install_plugins && \
        cp ~/tmux/pane-zoom.sh ~/.tmux/plugins/tmux/custom/
    '"

# Load catppuccin (must be before status-right so variables are defined)
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Status right (after catppuccin, before TPM so continuum can prepend its save hook)
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{?window_zoomed_flag,#{E:@catppuccin_status_zoom},}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
