# Status
# The bar is event-driven (agent transitions repaint via refresh-client);
# this interval only paces the tick watchdog and each periodic redraw
# blinks the cursor of open popups — keep it long. NOT 15: tmux-sensible
# overwrites the tmux-default value with 5.
set -g status-interval 20
set -g escape-time 10

# Terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Resolve dotfiles root from the ~/.tmux.conf symlink (works wherever the repo lives)
run-shell 'tmux setenv -g DOTFILES_DIR "$(dirname "$(readlink -f ~/.tmux.conf)")"'

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
bind C-a send-prefix

unbind %
bind v split-window -h -c "#{pane_current_path}"

unbind '"'
bind g split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Bind better session search (local fork of tmux-zoxide-session, see tzs-session-picker.sh)
unbind s
bind-key "s" run-shell '"$DOTFILES_DIR/tmux/tzs-session-picker.sh"'

# Agents: view, jump-to-urgent, click the status-bar ghost (tmux/agents/SPEC.md)
bind-key "a" run-shell '"$DOTFILES_DIR/tmux/tzs-session-picker.sh" agents'
bind-key "u" run-shell '[ ! -x "$DOTFILES_DIR/tmux/agents/agents-jump.sh" ] || "$DOTFILES_DIR/tmux/agents/agents-jump.sh"'
# only clicks landing on the agents widget open the view (range markers in
# theme.conf wrap the module; mouse_status_range carries the name here)
bind-key -T root MouseDown1StatusRight if -F '#{==:#{mouse_status_range},agents}' 'run-shell "\"$DOTFILES_DIR/tmux/tzs-session-picker.sh\" agents"'

# Session bindings
# l = back-jump to the previous exact location (nav-back.sh)
bind-key "l" run-shell '"$DOTFILES_DIR/tmux/nav-back.sh" back'
# L = classic last-session toggle: l lands on the exact pane you left,
# L flips to wherever the other session is now
bind-key "L" switch-client -l
bind-key "R" command-prompt -I "#S" "rename-session '%%'"
bind-key "C" run-shell "tmux attach-session -t . -c '#{pane_current_path}'"

set-option -g status-position top

bind -r m resize-pane -Z

bind-key o kill-pane -a

set -g allow-passthrough on

set-option -g history-limit 100000
set-option -g set-titles on
set-option -g set-titles-string "#T"

set -g mouse on
set-option -s focus-events on

# Use vi keys in copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Copy selection on mouse release but stay in copy mode (don't jump to bottom)
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# This block rebuilds status-right from scratch, so it also owns tmux-continuum's
# auto-save trigger: the plugin installs that trigger itself only when it sees a
# single tmux server, and one stray `tmux -L test` server is enough to make it
# skip — autosave then dies silently. Naming it here makes it reload-proof.
# Keep the path byte-identical to the one continuum builds from its own install
# dir, or its "already added" check misses and it prepends a second copy.
# The layout is theme-independent (resolves via #{E:}).
set -g status-right-length 200
set -g status-right "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
# invisible tick: sweeps dead agents / re-checks awaiting panes each
# status-interval (tmux/agents/agents-tick.sh prints nothing)
set -ag status-right "#([ ! -x $DOTFILES_DIR/tmux/agents/agents-tick.sh ] || $DOTFILES_DIR/tmux/agents/agents-tick.sh)"
set -ag status-right "#{E:@status_session}"
set -ag status-right "#{E:@status_directory}"
set -ag status-right "#{E:@status_agents}"
set -ag status-right "#{?window_zoomed_flag,#{E:@status_zoom},}"
# right-edge margin: one ribbon-background cell
set -ag status-right "#{E:@status_pad}"

# Agents layer (tmux/agents/SPEC.md)
# Resident event daemon: single writer of all agent state; hooks and
# adapters only append to its spool. The status tick doubles as watchdog.
run-shell -b '[ ! -x "$DOTFILES_DIR/tmux/agents/agentsd.sh" ] || "$DOTFILES_DIR/tmux/agents/agentsd.sh"'
# Ghost for the status-bar module and picker rows
set -g @agent_glyph "󰊠"
# Seeing a finished agent's pane clears the yellow story — unseen, and
# waiting-class awaits (an open conversation is acknowledged by visiting).
# The format guard keeps this free of shell spawns unless there is a real
# transition; dialog-class reds are excluded (visiting is not answering)
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{@agent_state},unseen},#{&&:#{==:#{@agent_state},action},#{==:#{@agent_prev},waiting}}}" "run-shell -b \"[ ! -x $DOTFILES_DIR/tmux/agents/agent-state.sh ] || $DOTFILES_DIR/tmux/agents/agent-state.sh seen claude #{hook_pane}\""'
# "Other sessions" changes meaning when you switch sessions — recompute the
# status-bar attention summary on every switch
set-hook -g client-session-changed 'run-shell -b "[ ! -x $DOTFILES_DIR/tmux/agents/agent-state.sh ] || $DOTFILES_DIR/tmux/agents/agent-state.sh resync claude -"'

# Leaving an awaiting pane re-checks its screen: ESC on a permission dialog
# fires no hook, so this is how a dismissed prompt's red gets cleared
set-hook -g 'pane-focus-out[1]' 'if -F "#{==:#{@agent_state},action}" "run-shell -b \"[ ! -x $DOTFILES_DIR/tmux/agents/agent-state.sh ] || $DOTFILES_DIR/tmux/agents/agent-state.sh escheck claude #{hook_pane}\""'

# Location history for C-s l (tmux/nav-back.sh) — depth one, zoom-aware
set-hook -g 'pane-focus-in[1]' 'run-shell -b "$DOTFILES_DIR/tmux/nav-back.sh track #{hook_pane}"'
set-hook -g 'client-session-changed[1]' 'run-shell -b "$DOTFILES_DIR/tmux/nav-back.sh track #{pane_id}"'

# Auto dark/light theme (tmux 3.6+ Mode 2031, fires on connect + OS change).
# The flavour file goes through run-shell: a source-file queued straight
# from these two hooks is parsed and then dropped, so the theme never
# lands. Re-entering the server as a fresh command applies it.
set-hook -g client-dark-theme  'run-shell "tmux source-file $DOTFILES_DIR/tmux/frappe.conf"'
# set-hook -g client-dark-theme  'run-shell "tmux source-file $DOTFILES_DIR/tmux/macchiato.conf"'
set-hook -g client-light-theme 'run-shell "tmux source-file $DOTFILES_DIR/tmux/latte.conf"'


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Install TMUX plugin manager if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bindings/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
